name: Ingest

# Runs the ingest scripts on GitHub's runners (open internet) and commits the
# outputs back to the branch. Trigger: edit scripts/ingest/requests.json on a
# claude/** branch, or run manually.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/ingest/requests.json"]

permissions:
  contents: write

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Record GISTDA fixture
        if: hashFiles('scripts/ingest/requests.json') != ''
        env:
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
        run: |
          if [ "$(node -p "require('./scripts/ingest/requests.json').gistdaFixture")" != "true" ]; then echo "skipped"; exit 0; fi
          if [ -z "$GISTDA_API_KEY" ]; then echo "::warning::GISTDA_API_KEY secret is not set; skipped"; exit 0; fi
          node scripts/ingest/record-gistda-fixture.mjs || echo "::warning::GISTDA call failed"
      - name: OpenStreetMap rail
        run: |
          if [ "$(node -p "require('./scripts/ingest/requests.json').osmRail")" != "true" ]; then echo "skipped"; exit 0; fi
          node scripts/ingest/osm-rail.mjs
      - name: HDX administrative boundaries
        run: |
          if [ "$(node -p "require('./scripts/ingest/requests.json').hdxAdmin")" != "true" ]; then echo "skipped"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
          node scripts/ingest/hdx-admin.mjs
      - name: Discover sources
        run: |
          urls=$(node -p "(require('./scripts/ingest/requests.json').discover || []).join(' ')")
          if [ -z "$urls" ]; then echo "skipped"; exit 0; fi
          node scripts/ingest/discover.mjs $urls
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p tests/fixtures
          git add -A tests/fixtures public/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Ingest outputs from GitHub Actions"
          git pull --rebase
          git push
